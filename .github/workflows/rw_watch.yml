name: rw-watch

on:
  schedule:
    # Запасной запуск: GitHub выполняет расписание «по возможности» и с задержками.
    # Основной запуск — Cloudflare Worker (раз в 10 минут), см. worker.js.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check — проверить все слежения (так вызывает бот), debug — тест разбора страницы"
        type: choice
        options: [check, debug]
        default: check
      hello_id:
        description: "Служебное поле: id нового слежения (заполняет бот, вручную не трогать)"
        required: false
        type: string
      from_station:
        description: "Только для debug: откуда, например Лунинец"
        required: false
        type: string
      to_station:
        description: "Только для debug: куда, например Минск"
        required: false
        type: string
      trip_date:
        description: "Только для debug: дата ГГГГ-ММ-ДД, например 2026-11-20"
        required: false
        type: string
      train:
        description: "Только для debug: номер поезда, например 658Б (пусто = любой)"
        required: false
        type: string

permissions:
  contents: write   # скрипт переводит новое слежение из «ждёт выбора» в «активно» (запись в watch.json)

concurrency:
  group: rw-watch-${{ inputs.hello_id || inputs.mode || 'check' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Если слежений нет, остальные шаги пропускаются (экономим время запуска)
      - name: Есть ли что проверять
        id: has
        run: |
          n=$(python3 -c "import json; d = json.load(open('watch.json')); print(len(d.get('watches') or []) if isinstance(d, dict) else 0)" 2>/dev/null || echo 0)
          echo "Слежений: ${n:-0}"
          echo "n=${n:-0}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.has.outputs.n != '0' || inputs.mode == 'debug'
        with:
          python-version: "3.12"

      - name: Установить зависимости
        if: steps.has.outputs.n != '0' || inputs.mode == 'debug'
        run: pip install requests beautifulsoup4

      - name: Проверить места
        if: steps.has.outputs.n != '0' || inputs.mode == 'debug'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          RW_HELLO_ID: ${{ inputs.hello_id }}
          RW_FROM: ${{ inputs.from_station }}
          RW_TO: ${{ inputs.to_station }}
          RW_DATE: ${{ inputs.trip_date }}
          RW_TRAIN: ${{ inputs.train }}
        run: |
          if [ "$MODE" = "debug" ]; then
            python rw_watch.py --debug
          else
            python rw_watch.py --once
          fi
